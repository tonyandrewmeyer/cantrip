repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # syrupy snapshots (``.ambr``) capture rendered output verbatim,
        # including significant trailing whitespace from Jinja templates;
        # stripping it would corrupt the golden files.
        exclude: '\.ambr$'
      - id: end-of-file-fixer
        exclude: '\.ambr$'
      - id: check-yaml
      - id: check-added-large-files
        # ``demos/recordings/web.gif`` is the Web-UI marketing
        # GIF; ``hero-ntfy.cast`` and its raw companion are the
        # hero asciicast (research → synthesis → design build of
        # ntfy from scratch).  All three are published assets the
        # marketing page embeds; they are intentionally over the
        # 500 KB default and excluded by path.
        exclude: '^demos/recordings/(web\.gif|hero-ntfy(-raw)?\.cast)$'
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ty
        name: ty type checker
        entry: uv run ty check src
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.31.1
    hooks:
      - id: check-github-workflows

ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
