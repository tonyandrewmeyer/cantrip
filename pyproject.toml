[project]
name = "cantrip"
version = "0.1.0"
description = "A small spell for building Juju charms - an AI-powered charm development agent"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Tony Meyer" },
]
keywords = ["juju", "charm", "agent", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # TUI
    "textual>=8.2.1",
    # LLM providers
    "google-genai>=1.69.0",        # Gemini
    "anthropic>=0.86.0",           # Claude
    # Juju integration
    "jubilant>=1.8,<2",            # Juju control (1.x is API-stable; pin to avoid silent v2 break)
    # Security
    "cryptography>=46.0.7",        # Transitive; pinned for CVE fix
    "requests>=2.33.0",            # Transitive; pinned for CVE fix
    "pygments>=2.20.0",            # Transitive; pinned for CVE fix
    # Web UI
    "aiohttp>=3.13.4",             # HTTP server + WebSocket
    # Utilities
    "pyyaml>=6.0",                 # YAML handling
    "rich>=14.3.3",                # Rich text formatting
    "httpx>=0.27.0",               # HTTP client
    "jinja2>=3.1",                 # Prompt templating
    "mcp>=1.27.0",
    "markdown-it-py[linkify]>=3.0",  # Web UI server-side Markdown rendering (linkify for autolink)
    "pillow>=11.0",                # Observability diagnostics (Phase 48.3 waterfall renderer)
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "coverage[toml]>=7.13.5",
    "ty",
    "ruff>=0.15.8",
    "zizmor>=1.24.1",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.104.0",
]

[project.scripts]
cantrip = "cantrip.main:main"
charmlint = "charmlint.cli:cli_entry"
quickpack = "quickpack.cli:main"

[project.urls]
Homepage = "https://github.com/tonyandrewmeyer/cantrip"
Documentation = "https://github.com/tonyandrewmeyer/cantrip#readme"
Repository = "https://github.com/tonyandrewmeyer/cantrip"
Issues = "https://github.com/tonyandrewmeyer/cantrip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cantrip", "src/charmlint", "src/quickpack", "src/pypi_attest"]

[tool.ruff]
line-length = 99
target-version = "py312"
# Gold-standard charm implementations are reference charms, not cantrip source.
extend-exclude = ["tests/eval/charms/*/gold-*"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG002"]  # Test fakes have unused params by design.

[tool.ruff.lint.isort]
known-first-party = ["cantrip", "charmlint", "quickpack", "pypi_attest"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Third-party library type stubs are incomplete or inaccurate.
invalid-method-override = "ignore"  # Tool.execute intentional dispatch pattern
possibly-missing-attribute = "ignore"  # Third-party lib types
not-subscriptable = "ignore"  # Third-party lib types (e.g. google-genai)
no-matching-overload = "ignore"  # Third-party lib types (e.g. google-genai)
unresolved-attribute = "ignore"  # Textual internals
invalid-assignment = "ignore"  # Textual reactive types
not-iterable = "ignore"  # Async iterator typing
invalid-argument-type = "ignore"  # Third-party lib calls

[tool.coverage.run]
source = ["cantrip"]
core = "sysmon"
# Parallel mode + multiprocessing concurrency let pytest-cov capture each
# xdist worker's traces in its own .coverage.<hostname>.<pid> file; the
# plugin combines them automatically at session end.
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # pytest-asyncio 1.3.0 in auto mode captures an "old_loop" via
    # ``asyncio.get_event_loop()`` for each sync test and never closes
    # it, so GC eventually emits ``ResourceWarning: unclosed event
    # loop``.  The leak is inside pytest-asyncio, not our code — filter
    # it narrowly so legitimate resource warnings still surface.
    "ignore:unclosed event loop:ResourceWarning",
]
markers = [
    "integration: tests with real tool execution (no external services)",
    "e2e: end-to-end multi-turn conversation scenarios",
    "tui: Textual app tests",
    "live: tests requiring real external services (Juju, LLM APIs)",
    "slow: slow tests (charmcraft comparison, real uv invocations)",
]
