[project]
name = "juju-cantrip"
version = "0.2.3"
description = "A small spell for building Juju charms - an AI-powered charm development agent"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Tony Meyer", email = "tony@aotearoa.dev" },
]
keywords = ["juju", "charm", "agent", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # TUI
    "textual>=8.2.3",
    # LLM providers
    "google-genai>=1.73.1",        # Gemini
    "anthropic>=0.97.0",           # Claude
    # Juju integration
    "jubilant>=1.8,<2",            # Juju control (1.x is API-stable; pin to avoid silent v2 break)
    # Security
    "cryptography>=46.0.7",
    "defusedxml>=0.7",        # Transitive; pinned for CVE fix
    "requests>=2.33.0",            # Transitive; pinned for CVE fix
    "pygments>=2.20.0",            # Transitive; pinned for CVE fix
    # Web UI
    "aiohttp>=3.13.4",             # HTTP server + WebSocket
    # Utilities
    "pyyaml>=6.0",                 # YAML handling
    "rich>=14.3.3",                # Rich text formatting
    "httpx>=0.27.0",               # HTTP client
    "jinja2>=3.1",                 # Prompt templating
    "mcp>=1.27.0",
    "markdown-it-py[linkify]>=4.0.0",  # Web UI server-side Markdown rendering (linkify for autolink)
    "mdit-py-plugins>=0.4",        # Attribute-block plugin used by docs/src/_build.py (Phase 54)
    "pillow>=11.0",                # Observability diagnostics (Phase 48.3 waterfall renderer)
    "jsonschema>=4.18.0",          # Structured-output validation (Phase 73.3)
    "packaging>=26.2",             # Version parsing in cantrip.update
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=8.1.0",
    "coverage[toml]>=7.13.5",
    "ty",
    "ruff>=0.16.0",
    "zizmor>=1.24.1",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.152.4",
]

[project.scripts]
cantrip = "cantrip.main:main"
charmlint = "charmlint.cli:cli_entry"
quickpack = "quickpack.cli:main"

[project.urls]
Homepage = "https://github.com/tonyandrewmeyer/cantrip"
Documentation = "https://github.com/tonyandrewmeyer/cantrip#readme"
Repository = "https://github.com/tonyandrewmeyer/cantrip"
Issues = "https://github.com/tonyandrewmeyer/cantrip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cantrip", "src/charmlint", "src/quickpack", "src/pypi_attest"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Third-party library type stubs are incomplete or inaccurate.
invalid-method-override = "ignore"  # Tool.execute intentional dispatch pattern
possibly-missing-attribute = "ignore"  # Third-party lib types
not-subscriptable = "ignore"  # Third-party lib types (e.g. google-genai)
no-matching-overload = "ignore"  # Third-party lib types (e.g. google-genai)
unresolved-attribute = "ignore"  # Textual internals
invalid-assignment = "ignore"  # Textual reactive types
not-iterable = "ignore"  # Async iterator typing
invalid-argument-type = "ignore"  # Third-party lib calls

[tool.coverage.run]
source = ["cantrip"]
core = "sysmon"
# Parallel mode + multiprocessing concurrency let pytest-cov capture each
# xdist worker's traces in its own .coverage.<hostname>.<pid> file; the
# plugin combines them automatically at session end.
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Regression gate: fail when total Python coverage drops below this floor.
# Current baseline (April 2026) sits at ~89%; the floor leaves a small margin
# for xdist-induced noise but flags any meaningful decline before merge.
# Raise this number alongside intentional coverage improvements.
fail_under = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # pytest-asyncio 1.3.0 in auto mode captures an "old_loop" via
    # ``asyncio.get_event_loop()`` for each sync test and never closes
    # it, so GC eventually emits ``ResourceWarning: unclosed event
    # loop``.  The leak is inside pytest-asyncio, not our code — filter
    # it narrowly so legitimate resource warnings still surface.
    "ignore:unclosed event loop:ResourceWarning",
]
markers = [
    "integration: tests with real tool execution (no external services)",
    "e2e: end-to-end multi-turn conversation scenarios",
    "tui: Textual app tests",
    "live: tests requiring real external services (Juju, LLM APIs)",
    "slow: slow tests (charmcraft comparison, real uv invocations)",
]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = [
    "tests/eval/charms/*/gold-*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "E501",
    # Method docstrings are not mandated; module/class/function docs are.
    "D102",
    # This tool deliberately shells out to juju/charmcraft/snap.
    "S603",
    "S607",
    # Prose uses real typography (en dashes, ×, curly quotes); these are
    # intentional, not homoglyph mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
    # Asserts are used for internal invariants and type narrowing, not for
    # validating untrusted input.
    "S101",
    # `id`/`type`/`input` mirror the textual and ops APIs this code wraps.
    "A002",
    # Jinja renders LLM prompts, not HTML; autoescaping would corrupt them.
    "S701",
    # `random` is used for retry jitter and sampling, never for secrets.
    "S311",
    # ProviderInfo is a frozen dataclass, so sharing one default is safe.
    "RUF009",
    # Names of environment variables and auth *methods*, not secrets.
    "S105",
    "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/test_claude.py" = ["N805"]  # Stub classes mimic SDK callables.
"tests/**/test_inference_snap.py" = ["N801"]  # Names encode model ids (Qwen3_14b).
"tests/**/test_mcp_apps.py" = ["N815"]  # Mirrors the MCP wire schema (mimeType).
"tests/**/test_rock_contract.py" = ["S103"]  # Sets exec bits on test fixtures.
"tests/**/test_observability_tools.py" = ["S107"]  # Dummy credentials.
"tests/**/test_mcp_elicitation.py" = ["RUF006"]  # Fire-and-forget tasks under test.
"demos/**" = ["S108"]  # Demo scripts write under /tmp deliberately.
"**/tests/**" = ["ARG002", "D", "S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806"]
