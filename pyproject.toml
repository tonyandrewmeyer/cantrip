[project]
name = "juju-cantrip"
version = "0.0.1"
description = "Placeholder release — the real juju-cantrip is coming soon."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Tony Meyer" },
]
keywords = ["juju", "charm", "agent", "ai", "llm"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
juju-cantrip = "juju_cantrip.__main__:main"

[project.urls]
Homepage = "https://github.com/tonyandrewmeyer/cantrip"
Repository = "https://github.com/tonyandrewmeyer/cantrip"
Issues = "https://github.com/tonyandrewmeyer/cantrip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/juju_cantrip"]
