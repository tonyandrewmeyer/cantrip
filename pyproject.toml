[project]
name = "cantrip"
version = "0.1.0"
description = "A small spell for building Juju charms - an AI-powered charm development agent"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Tony Meyer" },
]
keywords = ["juju", "charm", "agent", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # TUI
    "textual>=0.50.0",

    # LLM providers
    "google-genai>=1.0.0",         # Gemini
    "anthropic>=0.18.0",           # Claude

    # Juju integration
    "jubilant>=0.1.0",             # Juju control

    # Utilities
    "pyyaml>=6.0",                 # YAML handling
    "rich>=13.0",                  # Rich text formatting
    "httpx>=0.27.0",               # HTTP client
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "ty",
    "ruff>=0.2.0",
]

[project.scripts]
cantrip = "cantrip.main:main"

[project.urls]
Homepage = "https://github.com/tonyandrewmeyer/cantrip"
Documentation = "https://github.com/tonyandrewmeyer/cantrip#readme"
Repository = "https://github.com/tonyandrewmeyer/cantrip"
Issues = "https://github.com/tonyandrewmeyer/cantrip/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cantrip"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ARG",   # flake8-unused-arguments
    "SIM",   # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cantrip"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Relax some rules for initial development - tighten later
invalid-method-override = "warn"  # Tool.execute overrides
possibly-missing-attribute = "ignore"  # Third-party lib types
not-subscriptable = "warn"  # Third-party lib types (e.g. google-genai)
no-matching-overload = "warn"  # Third-party lib types (e.g. google-genai)
unresolved-attribute = "warn"  # Textual internals
invalid-assignment = "warn"  # Reactive types
not-iterable = "warn"  # Async iterator typing
invalid-argument-type = "warn"  # Third-party lib calls

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
