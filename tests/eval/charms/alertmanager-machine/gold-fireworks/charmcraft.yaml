# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: alertmanager
title: Alertmanager
summary: Prometheus Alertmanager handles alerts sent by client applications such as Prometheus.
description: |
  The Alertmanager charm deploys and operates Prometheus Alertmanager on
  Ubuntu machines.  Alertmanager handles alerts sent by client applications
  such as Prometheus, deduplicates, groups and routes them to the correct
  receiver integrations (email, PagerDuty, Slack, etc.).

  The charm installs Alertmanager from the Snap Store, manages its systemd
  service, generates configuration from charm options, supports HA clustering
  via a peer relation, and integrates with the Canonical Observability Stack
  (COS) for metrics and log forwarding.

base: ubuntu@24.04
platforms:
  amd64:
  arm64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

config:
  options:
    log-level:
      description: |
        Alertmanager log level.  Acceptable values are: "debug", "info",
        "warn", and "error".
      default: "info"
      type: string
    resolve-timeout:
      description: |
        Time after which an alert is declared resolved if it has not been
        updated.  Expressed as a Go duration string (e.g. "5m", "1h").
      default: "5m"
      type: string
    smtp-smarthost:
      description: |
        SMTP smarthost for email notifications in "host:port" format.
        If unset, no email receiver is generated in the configuration.
      default: ""
      type: string
    smtp-from:
      description: |
        Sender address for email notifications.  Only used when
        smtp-smarthost is set.
      default: ""
      type: string

actions:
  send-test-alert:
    description: |
      Send a synthetic test alert to the local Alertmanager instance so
      operators can verify the notification pipeline without waiting for
      real alerts from Prometheus.

provides:
  alerting:
    interface: alertmanager_dispatch
  metrics-endpoint:
    interface: prometheus_scrape
  grafana-dashboard:
    interface: grafana_dashboard

requires:
  replicas:
    interface: alertmanager_replica
    limit: 1
  logging:
    interface: loki_push_api
    limit: 1
  tracing:
    interface: tracing
    limit: 1

charm-libs:
  - lib: prometheus-k8s.prometheus_scrape
    version: "0"
  - lib: loki-k8s.loki_push_api
    version: "0"
  - lib: grafana-k8s.grafana_dashboard
    version: "0"
  - lib: tempo-k8s.tracing
    version: "0"
