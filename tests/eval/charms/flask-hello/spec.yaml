name: flask-hello
description: >
  A simple Flask web application on a machine substrate (Path B, custom app).
  Tests the custom non-framework application path: pip-based install inside a
  virtualenv, systemd service management, PostgreSQL database relation
  (requires), nginx reverse-proxy integration, and COS integration.  The
  application serves a basic greeting page backed by a PostgreSQL counter.

charm_path: custom
substrate: machine

workload:
  repo: https://github.com/pallets/flask
  tag: "3.1.1"
  port: 5000
  health: /health

prompt: >
  Build a machine charm for a simple Flask web application called
  "flask-hello".  The application is a custom Python app (Path B — not a
  12-factor PaaS image) that should be installed inside a virtualenv at
  /srv/flask-hello/venv, managed as a systemd service
  (flask-hello.service), and served on port 5000.  It needs a PostgreSQL
  database to store a page-view counter (DATABASE_URL env var), a config
  file at /etc/flask-hello/config.env, nginx as a reverse proxy (relates
  via the reverseproxy interface), and COS integration.  Config options:
  log-level (default info), debug (boolean, default false), workers
  (integer, default 2).  Include a reset-counter action that clears the
  page-view counter in the database.  The charm should block (not go active)
  until the postgresql relation is established.

follow_ups: []

rubric:
  # ── Structure ──────────────────────────────────────────────────────
  - name: charmcraft-yaml
    description: Primary project file exists
    category: structure
    severity: critical
    check: file_exists
    args: {path: charmcraft.yaml}
    points: 3

  - name: charm-source
    description: Main charm source file
    category: structure
    severity: critical
    check: file_exists
    args: {path: src/charm.py}
    points: 3

  - name: unit-test-dir
    description: Unit test directory
    category: structure
    severity: major
    check: dir_exists
    args: {path: tests/unit}
    points: 2

  - name: integration-test-dir
    description: Integration test directory
    category: structure
    severity: minor
    check: dir_exists
    args: {path: tests/integration}
    points: 1

  # ── Metadata ───────────────────────────────────────────────────────
  - name: charm-name
    description: Charm name is set
    category: metadata
    severity: critical
    check: metadata_field
    args: {field: name}
    points: 2

  - name: machine-base
    description: Targets a machine base (ubuntu@24.04)
    category: metadata
    severity: critical
    check: metadata_field
    args: {field: base}
    points: 2

  - name: postgresql-relation
    description: Requires a postgresql relation
    category: metadata
    severity: critical
    check: has_relation
    args: {relation: postgresql}
    points: 3

  - name: nginx-relation
    description: Requires or provides an nginx/reverseproxy relation
    category: metadata
    severity: major
    check: has_relation
    args: {relation: nginx-route}
    points: 2

  - name: log-level-config
    description: Config option for log verbosity
    category: metadata
    severity: minor
    check: has_config_option
    args: {option: log-level, type: string}
    points: 1

  - name: debug-config
    description: Config option to enable debug mode
    category: metadata
    severity: minor
    check: has_config_option
    args: {option: debug, type: boolean}
    points: 1

  - name: workers-config
    description: Config option for the number of gunicorn workers
    category: metadata
    severity: minor
    check: has_config_option
    args: {option: workers, type: int}
    points: 1

  - name: reset-counter-action
    description: Action to reset the page-view counter
    category: metadata
    severity: major
    check: has_action
    args: {action: reset-counter}
    points: 2

  # ── Code ───────────────────────────────────────────────────────────
  - name: uses-ops
    description: Charm uses the ops framework
    category: code
    severity: critical
    check: uses_ops_framework
    points: 3

  - name: systemd-service
    description: Charm manages a systemd service
    category: code
    severity: critical
    check: file_contains
    args:
      path: src/charm.py
      pattern: "systemd|systemctl|flask-hello\\.service|service.*restart"
      message: Charm manages the flask-hello systemd service
    points: 3

  - name: blocks-without-db
    description: Charm blocks until postgresql relation is available
    category: code
    severity: critical
    check: file_contains
    args:
      path: src/charm.py
      pattern: "BlockedStatus|waiting.*postgresql|blocked.*database"
      message: Charm blocks until the database relation is present
    points: 3

  - name: sets-database-url
    description: Charm passes DATABASE_URL to the application
    category: code
    severity: critical
    check: file_contains
    args:
      path: src/charm.py
      pattern: "DATABASE_URL"
      message: Charm sets DATABASE_URL for the Flask app
    points: 3

  - name: writes-config-file
    description: Charm writes a config/env file for the application
    category: code
    severity: major
    check: file_contains
    args:
      path: src/charm.py
      pattern: "config\\.env|write_text|open.*env|pathlib"
      message: Charm writes an application config file
    points: 2

  - name: virtualenv-or-pip
    description: Charm installs the application via pip or virtualenv
    category: code
    severity: major
    check: file_contains
    args:
      path: src/charm.py
      pattern: "venv|pip|virtualenv|/srv"
      message: Charm installs the Flask app in a virtualenv
    points: 2

  - name: port-5000
    description: Charm references the application port
    category: code
    severity: minor
    check: file_contains
    args:
      path: src/charm.py
      pattern: "5000|port"
      message: Charm opens or references port 5000
    points: 1

  # ── COS ────────────────────────────────────────────────────────────
  - name: cos-integration
    description: COS integration for observability
    category: cos
    severity: major
    check: has_cos_integration
    points: 3

  # ── Testing ────────────────────────────────────────────────────────
  - name: has-unit-tests
    description: At least one unit test file
    category: testing
    severity: major
    check: has_unit_tests
    points: 2

  - name: uses-scenario
    description: Unit tests use Scenario (ops.testing)
    category: testing
    severity: major
    check: uses_scenario_tests
    points: 2

  - name: no-harness
    description: No deprecated Harness usage
    category: testing
    severity: critical
    check: no_harness
    points: 2
