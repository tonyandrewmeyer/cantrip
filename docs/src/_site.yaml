      - { slug: howto-mcp, label: "Configure MCP servers" }
      - { slug: howto-charm-library, label: "Search the charm library" }
      - { slug: howto-charm-icon, label: "Generate a charm icon" }
      - { slug: howto-docs-index, label: "Index the charm docs" }
      - { slug: howto-mentions, label: "Use @-mention context" }
      - { slug: howto-hooks, label: "Configure hooks" }
      - { slug: howto-undo, label: "Undo agent changes" }
