version: 2

# Cadence rationale: weekly checks with a 7-day default cooldown, so a release
# has had a week to be yanked or patched before we see a PR. Majors wait 30
# days and arrive as individual PRs, because they are the ones worth reading;
# minor and patch updates are grouped into one PR per ecosystem to keep the
# review queue short.
updates:
  # Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # Rust crates (both production crates and their fuzz targets)
  - package-ecosystem: "cargo"
    directories:
      - "/src/charmlint-rs"
      - "/src/charmlint-rs/fuzz"
      - "/src/quickpack-rs"
      - "/src/quickpack-rs/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
