name: Warden

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  WARDEN_ANTHROPIC_API_KEY: ${{ secrets.WARDEN_ANTHROPIC_API_KEY }}

jobs:
  warden:
    # On PRs: skip forks and dependabot — WARDEN_ANTHROPIC_API_KEY is not
    # exposed to either (forks for security, dependabot by GitHub policy).
    # Manual dispatches always run (the person dispatching has secret access).
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: getsentry/warden@5caafb14e509293b6e0a7eb15015808f8c2dae58  # v0.41.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
