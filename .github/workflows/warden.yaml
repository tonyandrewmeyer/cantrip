name: Warden

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  WARDEN_ANTHROPIC_API_KEY: ${{ secrets.WARDEN_ANTHROPIC_API_KEY }}

jobs:
  warden:
    # Skip fork PRs and dependabot PRs: WARDEN_ANTHROPIC_API_KEY is not
    # exposed to either (forks for security, dependabot by GitHub policy).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: getsentry/warden@v0.22.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
