name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff check
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format --check src tests

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ty
        run: uv run ty check src

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Surface a macOS failure separately from a Linux failure instead
      # of cancelling the survivor — Phase 49.4 adds a macOS-only
      # ``sandbox-exec`` branch whose only enforcement is CI.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit and integration tests
        env:
          # CI runs hypothesis property tests at the deeper max_examples=500
          # sweep; local dev keeps the default 100 for fast feedback.
          CANTRIP_HYPOTHESIS_PROFILE: ci
        run: uv run pytest tests/unit tests/integration -n auto --cov=cantrip --cov-report=term

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run python -m tarfile -l dist/*.tar.gz

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Rebuild docs and diff against committed HTML (strict)
        run: make docs-check-strict

  rust-test:
    name: Rust Tests (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [charmlint-rs, quickpack-rs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src/${{ matrix.crate }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles(format('src/{0}/Cargo.toml', matrix.crate), format('src/{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.crate }}-

      - name: cargo test
        working-directory: src/${{ matrix.crate }}
        run: cargo test --all-targets

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8  # v2.85.8
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage (advisory — warn below 60% per file)
        working-directory: src/${{ matrix.crate }}
        run: |
          set -o pipefail
          cargo llvm-cov --summary-only --json > /tmp/rust-coverage.json
          jq -r --arg crate "${{ matrix.crate }}" '
            .data[0].files[]
            | select(.summary.lines.percent < 60)
            | "::warning file=src/\($crate)/\(.filename | sub(".*/src/\($crate)/"; ""))::line coverage \(.summary.lines.percent | floor)% (below 60% advisory threshold)"
          ' /tmp/rust-coverage.json
          jq -r '.data[0].totals | "Total line coverage: \(.lines.percent * 100 | floor / 100)% (\(.lines.covered)/\(.lines.count) lines)"' /tmp/rust-coverage.json
